name: Deploy Caroline Practice to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check
        run: |
          cp app.js /tmp/app.mjs && node --check /tmp/app.mjs
          cp als.js /tmp/als.mjs && node --check /tmp/als.mjs
      - name: Stage the public app
        run: |
          mkdir -p _site/vendor
          cp index.html app.js als.js styles.css apple-touch-icon.png _site/
          cp vendor/lamejs.js vendor/LICENSE _site/vendor/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
